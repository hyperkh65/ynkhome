name: Deploy to NAS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package standalone
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar czf deploy.tar.gz -C .next/standalone .

      - name: Upload package to NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: /tmp/

      - name: Deploy on NAS
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set +e
            export NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            echo "=== Extracting build ==="
            mkdir -p /volume1/web/ynkhome/.next/standalone
            tar xzf /tmp/deploy.tar.gz -C /volume1/web/ynkhome/.next/standalone
            echo "Extracted OK"

            echo "=== Stopping old server ==="
            pkill -f "standalone/server.js" 2>/dev/null && echo "killed" || echo "no old process"
            fuser -k 3102/tcp 2>/dev/null && echo "freed port" || echo "port was free"

            echo "=== Starting server ==="
            cd /volume1/web/ynkhome/.next/standalone
            PORT=3102 nohup $NODE server.js > /tmp/ynkhome.log 2>&1 &
            echo "PID=$!"

            echo "=== Done ==="
            exit 0
