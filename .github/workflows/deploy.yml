name: Deploy to NAS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            export NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node
            export PATH=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin:$PATH

            cd /volume1/web/ynkhome
            git pull origin main

            $NODE node_modules/.bin/next build --no-turbopack

            # 기존 프로세스 종료
            pkill -f "server.js.*ynkhome\|ynkhome.*server.js" 2>/dev/null || true
            fuser -k 3102/tcp 2>/dev/null || true
            sleep 2

            # standalone 서버 시작
            PORT=3102 nohup $NODE .next/standalone/server.js > /tmp/ynkhome.log 2>&1 &
            echo "Deployed PID=$!"
