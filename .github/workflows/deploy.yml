name: Deploy to NAS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy standalone to NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          source: ".next/standalone/,.next/static/"
          target: /volume1/web/ynkhome/

      - name: Restart server on NAS
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            export NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            # static 폴더 동기화 (SCP가 .next 아래에 넣으므로 정리)
            cp -r /volume1/web/ynkhome/.next/static /volume1/web/ynkhome/.next/standalone/.next/static 2>/dev/null || true
            cp -r /volume1/web/ynkhome/public /volume1/web/ynkhome/.next/standalone/public 2>/dev/null || true

            # 기존 프로세스 종료
            pkill -f "standalone/server.js" 2>/dev/null || true
            fuser -k 3102/tcp 2>/dev/null || true
            sleep 2

            # 서버 시작
            cd /volume1/web/ynkhome/.next/standalone
            PORT=3102 nohup $NODE server.js > /tmp/ynkhome.log 2>&1 &
            echo "Started PID=$! on port 3102"
            sleep 3
            curl -sf http://localhost:3102 > /dev/null && echo "OK: server responding" || echo "WARN: server not responding yet"
